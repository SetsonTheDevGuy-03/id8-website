<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 176" fill="none">
  <g stroke="white" stroke-linecap="round" stroke-linejoin="round">

    <!-- Outer cube hexagon -->
    <polygon points="100,8 172,48 172,128 100,168 28,128 28,48"
             stroke-width="6" fill="none"/>

    <!-- Inner face-dividing edges -->
    <line x1="100" y1="8"   x2="100" y2="88"  stroke-width="6"/>
    <line x1="28"  y1="128" x2="100" y2="88"  stroke-width="6"/>
    <line x1="172" y1="128" x2="100" y2="88"  stroke-width="6"/>

    <!-- TOP FACE: U-shaped circuit connector -->
    <path d="M52,62 L52,38 Q52,18 100,12 Q148,18 148,38 L148,62"
          stroke-width="5" fill="none"/>
    <circle cx="52"  cy="62" r="6" fill="white" stroke="none"/>
    <circle cx="148" cy="62" r="6" fill="white" stroke="none"/>

    <!-- LEFT FACE: "i" (small, upper-left) -->
    <circle cx="43" cy="74" r="4.5" fill="white" stroke="none"/>
    <line x1="43" y1="83" x2="43" y2="118" stroke-width="5.5"/>

    <!-- LEFT FACE: "D" (large) -->
    <!-- D stem -->
    <line x1="57" y1="69" x2="57" y2="133" stroke-width="6"/>
    <!-- D outer arc -->
    <path d="M57,69 Q97,69 97,101 Q97,133 57,133"
          stroke-width="6" fill="none"/>
    <!-- D inner arc (double-line detail) -->
    <path d="M63,77 Q85,77 85,101 Q85,125 63,125"
          stroke-width="2.5" fill="none"/>

    <!-- RIGHT FACE: "8" -->
    <!-- top oval outer -->
    <ellipse cx="136" cy="79"  rx="22" ry="16" stroke-width="5"   fill="none"/>
    <!-- bottom oval outer -->
    <ellipse cx="136" cy="113" rx="25" ry="19" stroke-width="5"   fill="none"/>
    <!-- top oval inner (double-line) -->
    <ellipse cx="136" cy="79"  rx="13" ry="9"  stroke-width="2.5" fill="none"/>
    <!-- bottom oval inner -->
    <ellipse cx="136" cy="113" rx="15" ry="11" stroke-width="2.5" fill="none"/>
    <!-- circuit dots left of 8 -->
    <circle cx="113" cy="79"  r="5" fill="white" stroke="none"/>
    <circle cx="113" cy="113" r="5" fill="white" stroke="none"/>
    <!-- connecting line between dots -->
    <line x1="113" y1="84" x2="113" y2="108" stroke-width="3"/>

  </g>
</svg>
